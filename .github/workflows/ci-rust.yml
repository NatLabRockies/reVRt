name: Rust checks
permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  check:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: v0.69.0
          cache: true
          frozen: true
          cache-write: ${{ github.ref == 'refs/heads/main' }}
          environments: dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "gha"
          # Don't cache for cargo check
          save-if: false

      - name: Run cargo check
        run: |
          pixi run -e dev cargo check --workspace --locked

  msrv:
    # Verify the declared minimum supported Rust version still builds
    needs: check
    name: Rust MSRV
    runs-on: ubuntu-latest
    env:
      # Keep in sync with workspace.package.rust-version in Cargo.toml.
      # The guard step below fails if these two ever drift apart.
      MSRV: 1.91.0
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Confirm MSRV matches Cargo.toml
        run: |
          declared="$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          if [ "$declared" != "$MSRV" ]; then
            echo "MSRV mismatch: Cargo.toml declares '$declared' but this workflow pins '$MSRV'." >&2
            echo "Update the MSRV env var in .github/workflows/ci-rust.yml to match." >&2
            exit 1
          fi
          echo "MSRV confirmed: $MSRV"

      - uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.6
        with:
            toolchain: ${{ env.MSRV }}
            override: true
            profile: minimal

      - name: Run cargo check on MSRV
        run: cargo check --workspace --locked --all-features --all-targets

  lints:
    # Only run tests if code looks OK
    needs: check
    name: Rust Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: v0.69.0
          cache: true
          frozen: true
          cache-write: ${{ github.ref == 'refs/heads/main' }}
          environments: dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "gha"
          # Don't cache for cargo fmt/clippy
          save-if: false

      - name: Run cargo fmt
        run: |
          pixi run -e dev --frozen cargo fmt --all --check

      - name: Run cargo clippy
        run: |
          pixi run -e dev --frozen cargo clippy --locked --all-features --tests -- -D warnings

  test:
    # Only run tests if code looks OK
    needs: check
    name: Rust Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.6
        with:
            toolchain: 1.96.1
            override: true
            profile: minimal

      - name: Set up MSVC developer command prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: v0.69.0
          cache: true
          frozen: true
          cache-write: ${{ github.ref == 'refs/heads/main' }}
          environments: dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "gha"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: pixi run tests-r
