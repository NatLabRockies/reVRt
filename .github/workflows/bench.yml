name: Benchmark

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - main
  pull_request:
     paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/bench.yml
      - pixi.lock
permissions:
  contents: write
  deployments: write

jobs:
  benchmark:
    name: Run Rust benchmark with criterion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: v0.69.0
          cache: true
          frozen: true
          cache-write: false
          environments: dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "gha"
          save-if: false

      - name: Run benchmark
        run: |
          pixi r -e dev cargo --locked install cargo-criterion
          pixi r -e dev cargo --locked criterion --output-format bencher --benches 2>&1 | tee output.txt

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        with:
          name: Rust Benchmark
          tool: 'cargo'
          output-file-path: output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # Show alert with commit comment on detecting possible performance
          # regression
          # Benchmarking with GA is noisy, so only alert significant
          # regressions.
          # TODO: This elevated threshold is temporary (see PR for details).
          #       Lower this value once the cache refactor restores performance.
          alert-threshold: '250%'
          comment-on-alert: true
          fail-on-alert: true
          alert-comment-cc-users: '@castelao @ppinchuk'
