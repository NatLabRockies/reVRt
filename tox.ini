[tox]
min_version = 4.26
envlist =
    py{312,313,314}-affine{240}-dask{26}-distributed{26}-geopandas{101}-numpy{224}-gaps{084}-rasterio{150}-rioxarray{22}-shapely{212}-zarr{316}

[gh-actions]
python =
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
usedevelop = True
commands = pytest {env:REVRT_TOX_TEST_PATH:tests} --dist loadscope {posargs}
deps =
    affine240: affine>=2.4.0
    dask26: dask>=2026.3.0
    distributed26: distributed>=2026.3.0
    geopandas101: geopandas>=1.1.3
    numpy224: numpy>=2.4.3
    gaps091: NLR-gaps>=0.9.2
    rasterio150: rasterio>=1.5.0
    rioxarray22: rioxarray>=0.22.0
    shapely212: shapely>=2.1.2
    zarr316: zarr>=3.1.6
    pytest>=8.0
    hypothesis>=6.0
extras =
    test
setenv =
    TOX_RUNNING = True

[testenv:msv]
usedevelop = True
description = minimum supported versions
deps=
    affine~=2.4.0
    dask~=2026.3.0
    distributed~=2026.3.0
    geopandas~=1.1.3
    numpy~=2.4.3
    rasterio~=1.5.0
    rioxarray~=0.22.0
    shapely~=2.1.2
    zarr~=3.1.6
    pytest>=8.0
    hypothesis>=6.0

[testenv:latest]
description = no constraints, thus latest version of dependencies
