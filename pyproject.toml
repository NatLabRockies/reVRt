[build-system]
requires = ["maturin>=1.9.3,<2.0"]
build-backend = "maturin"

[project]
name = "NLR-reVRt"
version = "0.4.1"
description = "National Laboratory of the Rockies' (NLR's) Transmission for reV tool"
readme = "README.rst"
authors = [
  {name = "Guilherme Castelão", email = "gpimenta@nlr.gov"},
  {name = "Paul Pinchuk", email = "ppinchuk@nlr.gov"},
]
maintainers = [
  {name = "Guilherme Castelão", email = "gpimenta@nlr.gov"},
  {name = "Paul Pinchuk", email = "ppinchuk@nlr.gov"},
]
license = {text = "BSD-3-Clause"}
keywords = ["NLR", "routing", "transmission", "reVRt", "reV", "reVX"]
requires-python = ">= 3.11"
classifiers=[
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "affine>=2.4.0,<3",
  "dask>=2026.3.0,<2027",
  "distributed>=2026.3.0,<2027",
  "fiona>=1.10.1,<2",
  "geopandas>=1.0.1,<2",
  "numpy>=2.2.4,<3",
  "odc-geo>=0.5.0rc1,<0.6",
  "pydantic>=2.11.7,<3",
  "python-slugify>=8.0.4,<9",
  "NLR-gaps>=0.9.1,<0.10",
  "rasterio>=1.4.3,<2",
  "rioxarray>=0.18.2,<0.19",
  "shapely>=2.1.1,<3",
  "xarray>=2025.9.0,<2026",
  "zarr>=3.0.7,<4",
]

[project.optional-dependencies]
dev = [
  "contextily>=1.6.2,<2",
  "datashader>=0.18.2,<0.19",
  "geoviews>=1.15.0,<2",
  "holoviews>=1.22.1,<2",
  "hvplot>=0.12.2,<0.13",
  "ipython>=9.1.0,<10",
  "jupyter>=1.1.1,<2",
  "jupyter_bokeh>=4.0.5,<5",
  "matplotlib>=3.10.1,<4",
  "maturin>=1.9.3,<2",
  "pipreqs>=0.4.13,<0.5",
  "ruff>=0.15.0",
  "ruff-lsp>=0.0.62",
]
test = [
  "hypothesis>=6.0,<7",
  "pytest>=8.3.5,<9",
  "pytest-cases>=3.8.6,<4",
  "pytest-cov>=6.1.1,<7",
  "pytest-mock>=3.14.0,<4",
  "pytest-profiling>=1.8.1,<2",
  "pytest-xdist>=3.6.1,<4",
  "rasterstats>=0.20.0,<0.21",
  "scikit-image>=0.25.2,<0.26",
  "snakeviz>=2.2.2,<3",
  "tox>=4.26.0,<5",
]
doc = [
  "ghp-import>=2.1.0,<3",
  "myst-parser>=4.0.1,<5",
  "numpydoc>=1.9.0,<2",
  "pydata-sphinx-theme>=0.16.1,<0.17",
  "sphinx>=8.2.3,<9",
  "sphinx-click>=6.1.0,<7",
  "sphinx-copybutton>=0.5.2,<0.6",
  "sphinx-tabs>=3.4.1,<4",
  "sphinxcontrib-mermaid>=1.2.3,<2",
]
build = [
  "build>=1.2.2,<2",
  "pkginfo>=1.12.1.2,<2",
  "twine>=6.1.0,<7",
]


[project.urls]
homepage = "https://github.com/NatLabRockies/reVRt"
documentation = "https://natlabrockies.github.io/reVRt/"
repository = "https://github.com/NatLabRockies/reVRt"

[project.scripts]
reVRt = "revrt._cli:main"


[tool.maturin]
manifest-path = "crates/revrt/Cargo.toml"
module-name = "revrt._rust"
features = ["pyo3/extension-module"]
include = [
  { path = "LICENSE", format = ["sdist", "wheel"] },
]


[tool.ruff]
line-length = 79

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
preview = true
select = [
  "A", # flake8-builtins
  "B", # flake8-bugbear
  "ARG", # flake8-unused-arguments
  "BLE", # flake8-blind-except
  "C4", # flake8-comprehensions
  "C90", # mccabe
  "COM", # flake8-commas
  "D", # pydocstyle
  "E", # pycodestyle
  "EM", # flake8-errmsg
  "F", # Pyflakes
  "FURB", # refurb
  "FLY", #  flynt
  "G", # flake8-logging-format
  "I", # isort
  "INP", # flake8-no-pep420
  "ISC", # flake8-implicit-str-concat
  "LOG", # flake8-logging
  "N", # pep8-naming
  "NPY", # numpy-specific
  "PD", # pandas-vet
  "PERF", # Perflint
  "PIE", # flake8-pie
  "PL", # Pylint
  "PTH", # flake8-use-pathlib
  "PYI", # flake8-pyi
  "Q", # flake8-quotes
  "RET", # flake8-return
  "RSE", # flake8-raise
  "RUF", # Ruff-specific rules
  "S", # flake8-bandit
  "SLF", # flake8-self
  "SIM", # flake8-simplify
  "TID", # flake8-tidy-imports (absolute imports)
  "TRY", # tryceratops
  "UP", # pyupgrade
  "W", # Warning
]
ignore = [
  "B028", # no-explicit-stacklevel
  "COM812", # missing-trailing-comma (incompatible with formatter)
  "D105", # undocumented-magic-method
  "D205", # blank-line-after-summary
  "D202", # no-blank-lines-after-function
  "D210", # surrounded-whitespace
  "D400", # first-line-should-end-with-a-period
  "D401", # non-imperative-mood
  "D403", # first-line-capitalized
  "FURB140", # reimplemented-starmap
  "I001", # unsorted-imports
  "PYI024", # collections-named-tuple
  "RUF012", # mutable-class-default
  "RUF031", # incorrectly-parenthesized-tuple-in-subscript
  "S101", # assert
  "S324", # hashlib-insecure-hash-function
  "S403", # suspicious-pickle-import
  "TRY003", # raise-vanilla-args
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
  "F401", # unused-import
]
"revrt/__init__.py" = [
  "RUF067", # non-empty-init-module
]
"revrt/routing/cli/finalize.py" = [
  "PLW2901", # redefined-loop-name
]
"tests/**.py" = [
  "ARG001", # unused-function-argument
  "INP001", # implicit-namespace-package
  "PLC2701", # import-private-name
  "PLR0914", # too-many-locals
  "PLR0915", # too-many-statements
  "PLR2004", # magic-value-comparison
  "PLR6301", # no-self-use
  "SLF001", # private-member-access
  "W505", # doc-line-too-long
]
"docs/source/conf.py" = [
  "W505", # doc-line-too-long
  "E501", # line-too-long
  "E402", # module-import-not-at-top-of-file
]

[tool.ruff.lint.pylint]
max-args = 10
max-positional-args = 10


[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "win-64", "linux-64"]


[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev", "doc", "test", "build"], solve-group = "default" }
doc = { features = ["doc"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
build = { features = ["build"], solve-group = "default" }

[tool.pixi.tasks]

[tool.pixi.feature.build.tasks]
build-wheel = { cmd = "maturin build" }

[tool.pixi.feature.dev.tasks]
lint = "ruff check ./revrt"
format = "ruff format ./revrt"
tests = "pytest --durations=20 -rapP -vv --cov=revrt --cov-report=html --cov-branch --cov-report=xml:coverage.xml --cov-fail-under=95 tests/python"
tests-u = "pytest --durations=20 -rapP -vv --cov=revrt --cov-report=html --cov-branch --cov-report=xml:coverage.xml --cov-fail-under=95 tests/python/unit"
tests-i = "pytest --durations=20 -rapP -vv --cov=revrt --cov-report=html --cov-branch --cov-report=xml:coverage.xml tests/python/integration"
tests-r = "cargo test --locked --workspace --no-fail-fast"
publish-revrt = "cargo publish --locked -p revrt --all-features"
publish-cli = "cargo publish --locked -p revrt-cli --all-features"

[tool.pixi.feature.doc.tasks]
python-docs = { cmd = "make clean html", cwd = "docs", env = { SPHINXOPTS = "--fail-on-warning --keep-going --nitpicky" }}

[tool.pixi.pypi-dependencies]
NLR-reVRt = { path = ".", editable = true }

[tool.pixi.dependencies]
# system
python = ">=3.11"
rust = ">=1.94.0,<1.95"
# package
affine = ">=2.4.0,<3"
dask = ">=2026.3.0,<2027"
distributed = ">=2026.3.0,<2027"
fiona = ">=1.10.1,<2"
geopandas = ">=1.0.1,<2"
numpy = ">=2.2.4,<3"
odc-geo = ">=0.5.0rc1,<0.6"
pydantic = ">=2.11.7,<3"
python-slugify = ">=8.0.4,<9"
rasterio = ">=1.4.3,<2"
rioxarray = ">=0.18.2,<0.19"
shapely = ">=2.1.1,<3"
xarray = ">=2025.9.0,<2026"
zarr = ">=3.0.7,<4"

# for gaps
packaging = ">=24.2,<25"

[tool.pixi.feature.dev.dependencies]
contextily = ">=1.6.2,<2"
datashader = ">=0.18.2,<0.19"
geoviews = ">=1.15.0,<2"
hdf5 = ">=1.14.6,<2"
holoviews = ">=1.22.1,<2"
hvplot = ">=0.12.2,<0.13"
ipython = ">=9.1.0,<10"
jupyter = ">=1.1.1,<2"
jupyter_bokeh = ">=4.0.5,<5"
matplotlib = ">=3.10.1,<4"
pip = ">=25.1.1,<26"
pipreqs = ">=0.4.13,<0.5"
ruff = ">=0.15.2,<0.16"
ruff-lsp = ">=0.0.62,<0.0.63"
rust-src = ">=1.94.0,<1.95"
maturin = ">=1.12.3,<2"

[tool.pixi.feature.test.dependencies]
hypothesis = ">=6.140.4,<7"
pytest = ">=8.3.5,<9"
pytest-cases = ">=3.8.6,<4"
pytest-cov = ">=6.1.1,<7"
pytest-mock = ">=3.14.0,<4"
pytest-profiling = ">=1.8.1,<2"
pytest-xdist = ">=3.6.1,<4"
rasterstats = ">=0.20.0,<0.21"
scikit-image = ">=0.25.2,<0.26"
snakeviz = ">=2.2.2,<3"
tox = ">=4.26.0,<5"

[tool.pixi.feature.doc.dependencies]
ghp-import = ">=2.1.0,<3"
make = ">=4.4.1,<5"
myst-parser = ">=4.0.1,<5"
numpydoc = ">=1.9.0,<2"
pandoc = ">=3.8.3,<4"
pydata-sphinx-theme = ">=0.16.1,<0.17"
sphinx = ">=8.2.3,<9"
sphinx-click = ">=6.1.0,<7"
sphinx-copybutton = ">=0.5.2,<0.6"
sphinx-tabs = ">=3.4.1,<4"
sphinxcontrib-mermaid = ">=1.2.3,<2"

[tool.pixi.feature.build.dependencies]
python-build = ">=1.2.2.post1,<2"
pkginfo = ">=1.12.1.2,<2"
twine = ">=6.1.0,<7"
maturin = ">=1.9.3,<2"


[tool.coverage.run]
branch = true

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_also = [
    # Have to re-enable the standard pragma
    "pragma: no cover",

    # Don't complain about missing debug-only code:
    "if self\\.debug",

    # Don't complain about repr methods
    "def __repr__",
    "def _repr_markdown_",

    # Don't complain about data I/O code
    "def load*",
    "def _load*",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if __name__ == .__main__.:",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",

    # Don't complain about logging debugging functions
    "def print_logging_info*",
    "def __cls_name",
]

omit = [
    # omit test files
    "tests/*",
    # omit setup file
    "setup.py",
    # omit pydantic model definitions files
    "revrt/models/*",
    # omit plotting utilities
    "plotting.py",
    # omit init files
    "__init__.py",
    # omit version file
    "_version.py",
    # omit pixi files
    ".pixi/*",
]


[tool.pytest.ini_options]
addopts = "--disable-warnings"
testpaths = [
    "tests/python/unit",
    "tests/python/integration",
]
