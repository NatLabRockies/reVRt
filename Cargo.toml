[workspace]
members = [ "crates/cli", "crates/revrt"]
default-members = ["crates/revrt"]
resolver = "3"

[workspace.package]
version = "0.0.8"
authors = [
  "Guilherme Castelão <gpimenta@nrel.gov>",
  "Paul Pinchuk <Pavlo.Pinchuk@nrel.gov>",
]
edition = "2024"
license = "BSD-3-Clause"
rust-version = "1.87.0"
repository = "https://github.com/NREL/reVRt"
categories = ["simulation"]
keywords = ["NRL", "routing", "transmission", "reV", "reVX"]

[workspace.dependencies]
revrt = { version = "0.0.8", path = "crates/revrt" }
clap = { version = "4.5.48", features = ["derive", "cargo"] }
criterion = { version = "0.8.1", features = ["html_reports"] }
derive_builder = "0.20.2"
dhat = "0.3.3"
ndarray = { version = "0.16.1", features = ["rayon"] }
object_store = "0.12.4"
pathfinding = "4.14.0"
pyo3 = { version = "0.26.0", features = [
    "abi3-py311",
    "extension-module",
    "macros",
    "chrono",
    "chrono-tz",
] }
pyo3-build-config = "0.26.0"
rand = "0.9.0"
rayon = "1.11.0"
serde = { version = "1.0.226", features = ["derive"] }
serde_json = { version = "1.0.143" }
tempfile = "3.23.0"
thiserror = "2.0.16"
tokio = { version = "1.49.0", features = ["fs", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"], default-features = true }
zarrs = { version = "0.22.10", features = ["async", "filesystem"] }
zarrs_object_store = { version = "0.5.0", features = ["fs"] }

[workspace.lints.rust]
# cargo criterion::criterion_group doesn't allow missing docs
# missing_docs = "deny"
